<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мониторинг АЗС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Пульт сети АЗС: сверху — сеть одной строкой, ниже — станции плиткой (худшие первыми) и живая лента отзывов справа. Светофор — полоса и точка. */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --ink: #18201d; --ink2: #56635d; --line: #dde3e0; --soft: #edf1ef;
  --brand: #0f6b4f; --brand-ink: #ffffff; --ok: #2f8a3d; --warn: #c78a00; --bad: #c8342b; --none: #9aa6a0; --star: #e0a400;
  --f-body: "Onest", "Segoe UI", system-ui, sans-serif; --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --panel: #151d1a; --ink: #e4ece8; --ink2: #9fb0a8; --line: #26312d; --soft: #1b2522;
  --brand: #3fc191; --brand-ink: #08130e; --ok: #5fcf6d; --warn: #f2bd3d; --bad: #ff6b5e; --none: #5e6b65; --star: #ffc93d; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0e1412; --panel: #151d1a; --ink: #e4ece8; --ink2: #9fb0a8; --line: #26312d; --soft: #1b2522;
  --brand: #3fc191; --brand-ink: #08130e; --ok: #5fcf6d; --warn: #f2bd3d; --bad: #ff6b5e; --none: #5e6b65; --star: #ffc93d; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); padding-top: env(safe-area-inset-top, 0px); }
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, .st:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
/* шапка */
header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.logo { display: flex; gap: 10px; align-items: center; margin-right: auto; }
.logo b { font-size: 1.25rem; letter-spacing: -0.01em; }
.logo i { width: 12px; height: 12px; border-radius: 3px; background: var(--brand); display: inline-block; }
.muted { color: var(--ink2); font-size: 0.85rem; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: 0.88rem; text-decoration: none; color: var(--ink); display: inline-block; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select.btn { padding-right: 28px; }
/* строка сети */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font: 600 1.6rem/1.15 var(--f-num); font-variant-numeric: tabular-nums; }
.kpi small { color: var(--ink2); font-size: 0.8rem; }
.kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); } .kpi.ok b { color: var(--ok); }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.alert { border: 1px solid color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; }
/* основное */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr); } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px; min-width: 0; }
.st { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; text-align: left; min-width: 0; }
.st:hover { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); }
.st[data-l="green"] { --c: var(--ok); } .st[data-l="yellow"] { --c: var(--warn); } .st[data-l="red"] { --c: var(--bad); } .st[data-l="none"] { --c: var(--none); }
.st-h { display: flex; align-items: baseline; gap: 8px; }
.st-h b { font-size: 1.15rem; } .st-h span { color: var(--ink2); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 0.86rem; }
.row b { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 1rem; }
.bar { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--c, var(--brand)); border-radius: 99px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 0.74rem; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--ink2); }
.chip.bad { background: color-mix(in srgb, var(--bad) 15%, var(--panel)); color: var(--bad); } .chip.warn { background: color-mix(in srgb, var(--warn) 18%, var(--panel)); color: color-mix(in srgb, var(--warn) 80%, var(--ink)); }
.stars { color: var(--star); letter-spacing: 1px; }
/* лента отзывов */
.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: grid; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - 30px); min-width: 0; }
.feed-h { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed-h b { margin-right: auto; }
.feed-l { overflow-y: auto; padding: 6px 0; }
.rv { padding: 10px 14px; border-bottom: 1px solid var(--soft); display: grid; gap: 5px; border-left: 3px solid transparent; }
.rv.bad { background: color-mix(in srgb, var(--bad) 6%, var(--panel)); border-left-color: var(--bad); }
.rv-top { display: flex; gap: 8px; align-items: center; min-width: 0; }
.rv-top b { font-size: 0.92rem; flex: none; } .rv-st { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: 0.8rem; }
.rate { flex: none; font: 600 0.78rem/1 var(--f-num); padding: 4px 7px; border-radius: 6px; color: #fff; }
.rate.r1 { background: var(--r1); } .rate.r2 { background: var(--r2); } .rate.r3 { background: var(--r3); color: var(--ink); } .rate.r4 { background: var(--r4); } .rate.r5 { background: var(--r5); }
.rv-text { margin: 0; font-size: 0.9rem; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.rv-text.open { -webkit-line-clamp: unset; display: block; }
.rv-meta { font-size: 0.76rem; color: var(--ink2); }
.day { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 8px 14px 4px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); border-bottom: 1px solid var(--soft); }
.src { font-size: 0.72rem; color: var(--ink2); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; }
/* 📄 печать карточки станции для управляющего — светлая, без кнопок, таблицы целиком */
#printBox, .print-only { display: none; }
@media print {
  :root { --bg: #fff; --panel: #fff; --ink: #000; --ink2: #333; --line: #bbb; --soft: #f1f1f1; color-scheme: light; }
  body.printing #app, body.printing dialog, body.printing #tip { display: none !important; }
  body.printing #printBox { display: block; } body.printing .print-only { display: block; }
  #printBox .dlg { padding: 0; } #printBox .tbl, #printBox div[style*="overflow"] { overflow: visible !important; max-height: none !important; }
  #printBox table { page-break-inside: auto; } #printBox tr { page-break-inside: avoid; }
  #printBox .sign { margin-top: 28px; font-size: 0.9rem; display: grid; gap: 18px; }
  @page { size: A4; margin: 12mm; }
}
/* вкладки и таблица отзывов */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 10px 16px; font-weight: 600; color: var(--ink2); border-bottom: 3px solid transparent; cursor: pointer; font-size: 0.95rem; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.tab .n { font: 500 0.75rem var(--f-num); color: var(--ink2); margin-left: 6px; padding: 1px 6px; border-radius: 99px; background: var(--soft); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.filters label { display: grid; gap: 3px; font-size: 0.76rem; color: var(--ink2); }
.filters select, .filters input { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 14px; }
.filters input { min-width: 200px; }
.rsum { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.88rem; color: var(--ink2); align-items: center; }
.rsum b { color: var(--ink); font-family: var(--f-num); }
.rtab { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rtab th { background: var(--soft); text-align: left; font-size: 0.74rem; font-weight: 600; color: var(--ink2); padding: 9px 12px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.rtab td { padding: 10px 12px; border-top: 1px solid var(--soft); border-bottom: 0; vertical-align: top; font-size: 0.9rem; white-space: normal; text-align: left; }
.rtab tr.bad td { background: color-mix(in srgb, var(--bad) 5%, var(--panel)); }
.rtab tr.bad td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.rtab .c-date { white-space: nowrap; font-family: var(--f-num); font-size: 0.82rem; color: var(--ink2); width: 92px; }
.rtab .c-date b { display: block; color: var(--ink); font-family: var(--f-body); font-size: 0.9rem; }
.rtab .c-st { width: 190px; } .rtab .c-st b { display: block; } .rtab .c-st span { font-size: 0.78rem; color: var(--ink2); }
.rtab .c-rate { width: 64px; } .rtab .c-src { width: 140px; font-size: 0.82rem; color: var(--ink2); }
.rtab .c-text p { margin: 0; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.rtab .c-text p.open { -webkit-line-clamp: unset; display: block; }
.more { justify-self: center; }
@media (max-width: 760px) {
  .rtab thead { display: none; } .rtab, .rtab tbody, .rtab td { display: block; width: auto !important; }
  .rtab tr { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 8px 4px; border-top: 1px solid var(--line); }
  .rtab td { border: 0; padding: 2px 8px; } .rtab .c-rate { grid-column: 1; grid-row: 1; } .rtab .c-st { grid-column: 2; grid-row: 1; } .rtab .c-date { grid-column: 3; grid-row: 1; text-align: right; }
  .rtab .c-text, .rtab .c-src { grid-column: 1 / -1; } .rtab tr.bad td:first-child { box-shadow: none; } .rtab tr.bad { box-shadow: inset 3px 0 0 var(--bad); background: color-mix(in srgb, var(--bad) 5%, var(--panel)); } .rtab tr.bad td { background: none; }
}
.spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 10px; }
.spec > div { border-radius: 12px; background: var(--soft); padding: 12px 14px; display: grid; gap: 6px; }
.spec b { font-size: 1rem; } .spec .chips .chip { background: var(--panel); }
.up-list { display: grid; gap: 6px; } .up-list > div { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-radius: 8px; background: var(--soft); font-size: 0.86rem; }
.up-list > div > span:first-child { margin-right: auto; }
.prev { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 0.88rem; }
.prev.err { border-color: var(--bad); } .warn-t { color: var(--warn); font-size: 0.82rem; } .err-t { color: var(--bad); font-size: 0.85rem; }
.field { display: grid; gap: 4px; font-size: 0.85rem; color: var(--ink2); } .field input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
@media (max-width: 1100px) { .feed { position: static; max-height: 70vh; } }
/* подробности станции */
dialog { border: 0; padding: 0; border-radius: 14px; background: var(--panel); color: var(--ink); width: min(1000px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(5, 10, 8, .55); }
.dlg { display: grid; gap: 16px; padding: 18px 20px 22px; }
.dlg-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.dlg-h h2 { margin: 0; font-size: 1.4rem; } .dlg-h .x { margin-left: auto; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
h3 { margin: 0 0 8px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink2); }
.tbl { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--soft); text-align: left; white-space: nowrap; } th { color: var(--ink2); font-weight: 500; font-size: 0.78rem; }
td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.lv-ok { color: var(--ok); } .lv-warn { color: var(--warn); } .lv-bad { color: var(--bad); }
.it { display: grid; grid-template-columns: 170px 1fr 44px; gap: 8px; align-items: center; font-size: 0.86rem; } .it .num { text-align: right; }
.list { display: grid; gap: 6px; font-size: 0.88rem; } .list > div { padding: 7px 10px; border-radius: 8px; background: var(--soft); overflow-wrap: anywhere; }
.empty { color: var(--ink2); font-size: 0.88rem; padding: 6px 0; }
/* наглядная часть: кольца, распределения, графики по месяцам */
:root { --r5: #2f8a3d; --r4: #7cb87f; --r3: #b9c0bc; --r2: #e8907f; --r1: #c8342b; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --grid: #e6ebe8; --axis: #8c9691; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --r5: #5fcf6d; --r4: #3f8f4b; --r3: #59625e; --r2: #b55a4e; --r1: #ff6b5e; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --grid: #222c28; --axis: #7d8a84; } }
:root[data-theme="dark"] { --r5: #5fcf6d; --r4: #3f8f4b; --r3: #59625e; --r2: #b55a4e; --r1: #ff6b5e; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --grid: #222c28; --axis: #7d8a84; }
.hero { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 12px; }
@media (max-width: 1000px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.panel h3 { margin: 0; }
.gauge { display: flex; gap: 16px; align-items: center; }
.gauge svg { flex: none; }
.gauge-t { display: grid; gap: 4px; font-size: 0.88rem; color: var(--ink2); }
.gauge-t b { color: var(--ink); font-size: 1rem; }
.big { font: 600 2.4rem/1 var(--f-num); font-variant-numeric: tabular-nums; }
.dist { display: grid; gap: 5px; }
.dist-r { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px; align-items: center; font-size: 0.85rem; }
.dist-r .track { height: 12px; border-radius: 4px; background: var(--soft); overflow: hidden; } .dist-r .track i { display: block; height: 100%; border-radius: 4px; }
.dist-r .num { text-align: right; color: var(--ink2); }
.sig { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sig div { border-radius: 10px; background: var(--soft); padding: 9px 11px; display: grid; gap: 1px; }
.sig b { font: 600 1.35rem/1.15 var(--f-num); font-variant-numeric: tabular-nums; } .sig small { color: var(--ink2); font-size: 0.76rem; }
.sig .bad b { color: var(--bad); } .sig .warn b { color: var(--warn); } .sig .ok b { color: var(--ok); }
.charts { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; } @media (max-width: 1000px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 11px var(--f-body); fill: var(--axis); }
.chart .lbl { fill: var(--ink2); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--ink2); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hbar { display: grid; gap: 6px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
.hbar-r { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 0.85rem; }
.hbar-r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-r .track { height: 12px; border-radius: 4px; background: var(--soft); position: relative; } .hbar-r .track i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.hbar-r .track u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink2); opacity: .55; text-decoration: none; }
.hbar-r .num { text-align: right; color: var(--ink2); font-size: 0.82rem; }
.stack { display: flex; gap: 2px; height: 16px; border-radius: 5px; overflow: hidden; }
.mini { display: flex; gap: 10px; align-items: center; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 6px 9px; border-radius: 7px; max-width: 260px; display: none; line-height: 1.35; }
[data-tip] { cursor: default; }
/* вход */
.login { min-height: 80vh; display: grid; place-items: center; }
.login form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; width: min(360px, 100%); }
.login input { padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.login button { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 9px; padding: 10px; font-weight: 600; cursor: pointer; }
.err { color: var(--bad); font-size: 0.88rem; }
/* режим экрана в офисе */
body.tv { font-size: 17px; } body.tv .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); } body.tv .hide-tv { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="tip" role="tooltip"></div>
<div id="printBox"></div>
<script type="module">
import { build, mergeUploads } from "/js/calc.mjs";
import { readXlsx, parseBlank } from "/js/blank.mjs";
const ROLE = "__AUTH__", AUTH = ROLE === "boss" || ROLE === "osk", LOGIN_ERR = "__ERR__" === "1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rub = n => Math.round(+n || 0).toLocaleString("ru-RU").replace(/ /g, " ") + " ₽";
const pct = v => v == null ? "—" : v + "%";
const lvl = v => v == null ? "" : v >= 85 ? "lv-ok" : v >= 70 ? "lv-warn" : "lv-bad";
const stars = r => "★".repeat(Math.round(r || 0)) + "☆".repeat(5 - Math.round(r || 0));
const SRC = { telegram: "Telegram", "2gis": "2ГИС", yandex: "Яндекс", google: "Google" };

        ${s.fund.candidates.length ? `<div class="tbl" style="margin-top:8px"><table><thead><tr><th>Итоги квартала</th><th>Средний % за квартал</th><th>Грубых в месяц, макс.</th><th>Поощрение</th></tr></thead><tbody>${s.fund.candidates.map(c => `<tr><td>${c.ok ? "⭐ " : ""}${esc(c.name)}</td><td class="n ${lvl(c.qAvg)}">${pct(c.qAvg)}</td><td class="n">${c.gMax}</td><td>${s.fund.winners.includes(c.name) ? `<b class="lv-ok">${rub(s.fund.each)}</b>` : c.ok ? `<span class="lv-ok">претендует</span>` : `<span class="muted">${c.qAvg == null ? "нет проверок" : c.qAvg < s.cfg.bonusPct ? "ниже " + s.cfg.bonusPct + " %" : "много грубых"}</span>`}</td></tr>`).join("")}</tbody></table></div>` : ""}` : `<div class="empty">Фонд считается по загруженным бланкам — проверок станции пока нет.</div>`}</div>
      <div><h3>Где проседает — пункты стандарта</h3>${s.items.some(i => i.pct != null) ? s.items.map(i => `<div class="it"><span>${esc(i.name)}</span><div class="bar" style="--c:${i.pct == null ? "var(--none)" : i.pct >= 85 ? "var(--ok)" : i.pct >= 70 ? "var(--warn)" : "var(--bad)"}"><i style="width:${i.pct || 0}%"></i></div><span class="num">${pct(i.pct)}</span></div>`).join("") : `<div class="empty">Нет данных.</div>`}</div>
      <div><h3>Тайный покупатель</h3>${s.shop.length ? s.shop.slice(0, 3).map(v => `<div class="list"><div><b>${dd(v.date)} — ${pct(v.pct)}</b><br>${v.sections.filter(x => x.pct != null).map(x => `${esc(x.section)}: ${x.pct}%`).join(" · ")}${v.note ? `<br><span class="muted">${esc(v.note)}</span>` : ""}</div></div>`).join("") : `<div class="empty">Проверок тайного покупателя за месяц нет.</div>`}</div>
      <div><h3>Находки ОСК и ОСБ</h3>${s.finds.length ? `<div class="list">${s.finds.slice(0, 8).map(f => `<div><b class="${!f.fixed && f.due && f.due < new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10) ? "lv-bad" : f.fixed ? "lv-ok" : "lv-warn"}">${f.fixed ? "исправлено" : f.due ? "до " + dd(f.due) : "открыто"}</b> · ${dd(f.date)} · ${esc(f.who)}<br>${esc(f.what)}${f.to ? ` <span class="muted">→ ${esc(f.to)}</span>` : ""}</div>`).join("")}</div>` : `<div class="empty">Находок нет.</div>`}</div>
    </div>
    <div><h3>Отзывы о станции · ${mName(D.month)}</h3>${rs.length ? `<div style="max-height:380px;overflow:auto"><table class="rtab"><thead><tr><th>Когда</th><th>Оценка</th><th>Отзыв</th><th>Источник · автор</th></tr></thead><tbody>${rs.slice(0, 60).map(r => revRow(r, false)).join("")}</tbody></table></div>` : `<div class="empty">${s.reviewName ? "Отзывов нет." : "Станция не сопоставлена с отзывами — впишите «Название в отзывах» в листе «Станции»."}</div>`}</div>
  </div>`;
  $("#close").onclick = () => $("#dlg").close();
  /* 📄 PDF для управляющего: печать карточки станции (в окне печати — «Сохранить как PDF»); подписи — внизу */
  $("#pdf").onclick = () => { const box = $("#printBox"); box.innerHTML = $("#dlg .dlg").outerHTML + `<div class="sign"><p>С результатом ознакомлен(а), управляющий: ______________________ / ______________ «___» ________ 20__</p><p>Операторы ознакомлены под подпись: ______________________________________________</p></div>`; box.querySelectorAll(".no-print, .rv-text, details").forEach(x => x.classList.contains("no-print") && x.remove()); document.body.classList.add("printing"); window.print(); };
  document.querySelectorAll("#dlg .c-text p").forEach(p => p.onclick = () => p.classList.toggle("open"));
  $("#dlg").showModal();
}
/* 📤 бланк ОСК станции: файл Excel или ссылка на Google-таблицу → разбор здесь → показываем, что нашли → «Добавить на экран» */
let PENDING = [];
function openUpload() {
  const idx = [...(D.uploadIndex || [])].sort((a, b) => b.at - a.at);
  $("#dlg").innerHTML = `<div class="dlg">
    <div class="dlg-h"><h2 id="dlgTitle">Бланк ОСК станции</h2><span class="muted">файл бланка (Excel) или ссылка на Google-таблицу станции</span><button class="btn x" type="button" id="close">Закрыть</button></div>
    <div class="cols"><label class="field" for="upFile">Файлы бланков (можно несколько)<input id="upFile" type="file" accept=".xlsx,.xlsm" multiple></label>
      <label class="field" for="upLink">или ссылка на Google-таблицу<span style="display:flex;gap:6px"><input id="upLink" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" style="flex:1;min-width:0"><button class="btn" id="upGo" type="button">Открыть</button></span></label></div>
    <div id="upPrev" class="up-list"></div>
    <div><button class="btn pri" id="upSave" type="button" hidden>Добавить на экран</button></div>
    <div><h3>Таблицы станций на автообновлении · раз в час</h3>${(RAW.links || []).length ? `<div class="up-list">${RAW.links.map(L => `<div><span><b>${esc(L.station)}</b> <span class="muted">· ${esc(L.link.replace(/^https:\/\/docs\.google\.com\/spreadsheets\/d\//, "").slice(0, 18))}…</span></span><button class="btn" type="button" data-relink="${esc(L.link)}">Обновить сейчас</button><button class="btn" type="button" data-unlink="${esc(L.link)}">Снять</button></div>`).join("")}</div><div class="muted">${esc(SYNC.note || "Экран сам перечитывает эти таблицы раз в час, пока он открыт хотя бы у одного человека.")}</div>` : `<div class="empty">Пока нет. Вставьте ссылку на Google-таблицу станции выше — после «Добавить на экран» она будет обновляться сама.</div>`}</div>
    <div><h3>Уже загружено</h3>${idx.length ? `<div class="up-list">${idx.map(x => `<div><span><b>${esc(x.station)}</b> · ${mName(x.month)} · ${esc(x.checker || "")} <span class="muted">· клиентов ${x.obs}, грубых ${x.gross}${x.shop ? ", тайный покупатель" : ""} · ${esc(x.file || "")} · ${new Date(x.at).toLocaleDateString("ru-RU")} ${x.by === "osk" ? "(ОСК)" : "(руководство)"}</span></span>${x.link ? `<button class="btn" type="button" data-relink="${esc(x.link)}">Обновить из таблицы</button>` : ""}<button class="btn" type="button" data-del="${esc(x.key)}">Убрать</button></div>`).join("")}</div>` : `<div class="empty">Пока ничего не загружено.</div>`}</div>
  </div>`;
  PENDING = [];
  $("#close").onclick = () => $("#dlg").close();
  $("#upFile").onchange = async e => { for (const f of e.target.files) await addBlank(await f.arrayBuffer(), f.name, ""); };
  $("#upGo").onclick = () => fromLink($("#upLink").value.trim(), true);
  $("#upSave").onclick = saveBlanks;
  $("#dlg").querySelectorAll("[data-relink]").forEach(b => b.onclick = () => fromLink(b.dataset.relink, true));
  $("#dlg").querySelectorAll("[data-unlink]").forEach(b => b.onclick = async () => { if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Точно снять?"; return; } b.disabled = true; await fetch("/api/link?link=" + encodeURIComponent(b.dataset.unlink), { method: "DELETE" }); await load(); openUpload(); });
  $("#dlg").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Точно убрать?"; return; } b.disabled = true; await fetch("/api/upload?key=" + encodeURIComponent(b.dataset.del), { method: "DELETE" }); await load(); openUpload(); });
  if (!$("#dlg").open) $("#dlg").showModal();
}
async function fromLink(link, fresh = false) {
  if (!link) return; const box = $("#upPrev"); box.insertAdjacentHTML("beforeend", `<div class="prev" id="lnk">Открываю таблицу…</div>`);
  try { const r = await fetch("/api/gsheet?link=" + encodeURIComponent(link) + (fresh ? "&fresh=1" : "")); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "таблица не открылась"); $("#lnk")?.remove(); await addBlank(await r.arrayBuffer(), "Google-таблица", link); }
  catch (e) { const el = $("#lnk"); if (el) { el.id = ""; el.className = "prev err"; el.innerHTML = `<span class="err-t">Ссылка: ${esc(e.message)}</span>`; } }
}
async function addBlank(buf, file, link) {
  let B; try { B = parseBlank(await readXlsx(buf)); } catch (e) { $("#upPrev").insertAdjacentHTML("beforeend", `<div class="prev err"><b>${esc(file)}</b><span class="err-t">Не прочитался: ${esc(e.message)}. Нужен файл Excel (.xlsx или .xlsm).</span></div>`); return; }
  const bad = !B.station || !B.month || !B.obs.length, R = !bad && build(mergeUploads(RAW.sheet || {}, [B]), [], { month: B.month, today: RAW.today }).stations.find(s => s.code === B.station);
  const replace = (D.uploadIndex || []).some(x => x.station === B.station && x.month === B.month);
  if (!bad) PENDING.push({ ...B, file, link, hash: hashOf(B) });
  $("#upPrev").insertAdjacentHTML("beforeend", `<div class="prev ${bad ? "err" : ""}"><b>${esc(file)}</b>
    ${bad ? `<span class="err-t">Не получится добавить: ${esc(B.warnings[0] || "нет данных")}</span>` : `<span><b>${esc(B.station)}</b> · ${mName(B.month)} · проверяющий ${esc(B.checker || "—")} · операторов ${B.operators.length} · клиентов ${B.obs.length} · грубых ${B.gross.length}${B.shop.length ? " · тайный покупатель" : ""}</span>
      <span>Станция: <b class="${lvl(R.pct)}">${pct(R.pct)}</b> · ${R.operators.map(o => `${esc(o.name)} ${pct(o.pct)}`).join(", ")} · взыскания ${rub(R.fines)}</span>${replace ? `<span class="warn-t">Эта станция за этот месяц уже загружена — заменится новой.</span>` : ""}`}
    ${!bad && B.warnings.length ? B.warnings.map(w => `<span class="warn-t">⚠ ${esc(w)}</span>`).join("") : ""}</div>`);
  $("#upSave").hidden = !PENDING.length; $("#upSave").textContent = `Добавить на экран (${PENDING.length})`;
}
async function saveBlanks() {
  const b = $("#upSave"); b.disabled = true; let ok = 0, err = "";
  for (const B of PENDING) { const r = await fetch("/api/upload", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(B) }); if (r.ok) ok++; else err = (await r.json().catch(() => ({}))).error || "не сохранилось"; }
  PENDING = []; await load(); openUpload(); $("#upPrev").innerHTML = `<div class="prev">${ok ? `✅ Добавлено бланков: ${ok}. Экран обновлён.` : ""}${err ? `<span class="err-t">${esc(err)}</span>` : ""}</div>`;
}
if (!AUTH) loginView(); else { load(); timer = setInterval(() => { if (!$("#dlg").open) load(); }, 60000); }
$("#dlg").addEventListener("close", () => { if (RAW) render(); });
window.addEventListener("afterprint", () => { document.body.classList.remove("printing"); $("#printBox").innerHTML = ""; });
</script>
</body>
</html>
